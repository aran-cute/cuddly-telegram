<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 دیارییەک بۆ ئاران گیان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:radial-gradient(ellipse at top,#3d1a5c 0%,#1a0b2e 50%,#0d0518 100%);
  font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
  padding:20px;
  overflow-x:hidden;
  position:relative;
}

/* ئەستێرەکان */
.star-bg {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

.star-bg::before,
.star-bg::after {
  content:'';
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(2px 2px at 20% 30%, #fff, transparent),
    radial-gradient(2px 2px at 60% 70%, #fff, transparent),
    radial-gradient(1px 1px at 50% 50%, #fff, transparent),
    radial-gradient(1px 1px at 80% 10%, #fff, transparent),
    radial-gradient(2px 2px at 90% 60%, #ffd700, transparent),
    radial-gradient(1px 1px at 33% 80%, #fff, transparent),
    radial-gradient(1px 1px at 15% 60%, #fff, transparent),
    radial-gradient(2px 2px at 70% 40%, #fff, transparent);
  background-size:200% 200%;
  animation:twinkleStar 4s ease-in-out infinite alternate;
}

@keyframes twinkleStar {
  0%{ opacity:.5; }
  100%{ opacity:1; }
}

/* دڵ و گوڵی فڕیو */
.floaty {
  position:fixed;
  top:-10%;
  pointer-events:none;
  z-index:2;
  animation:fall linear infinite;
  filter:drop-shadow(0 0 8px rgba(255,182,193,.8));
}

@keyframes fall {
  0%{ transform:translateY(-10vh) rotate(0); opacity:1; }
  100%{ transform:translateY(115vh) rotate(360deg); opacity:0; }
}

/* کارتی سەرەوە */
.top-card {
  position:relative;
  z-index:10;
  background:rgba(255,255,255,.95);
  border-radius:50px;
  padding:8px 24px;
  margin-bottom:20px;
  box-shadow:0 8px 30px rgba(255,105,180,.5);
  border:2px solid #ffb3c6;
}

.top-card span {
  color:#c2255c;
  font-weight:700;
  font-size:1rem;
}

/* سەرنووسە */
h1 {
  position:relative;
  z-index:10;
  font-size:clamp(1.5rem,6vw,3rem);
  text-align:center;
  margin-bottom:10px;
  font-weight:900;
  line-height:1.8;
  padding:0 10px;
  color:#fff;
  text-shadow:
    0 0 20px #ff69b4,
    0 0 40px #ff69b4,
    0 0 60px #ff1493,
    2px 2px 4px rgba(0,0,0,.5);
  animation:glowText 2s ease-in-out infinite alternate;
}

@keyframes glowText {
  0%{ text-shadow:0 0 15px #ff69b4, 0 0 30px #ff1493; }
  100%{ text-shadow:0 0 25px #ff69b4, 0 0 50px #ff1493, 0 0 80px #ff1493; }
}

.subtitle {
  position:relative;
  z-index:10;
  color:#ffd6e8;
  text-align:center;
  font-size:clamp(1rem,3.5vw,1.3rem);
  margin-bottom:35px;
  font-weight:600;
  padding:0 15px;
  line-height:1.9;
}

/* پشیلە */
.cat-wrap {
  position:relative;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cat-box {
  position:relative;
  cursor:pointer;
  animation:float 3s ease-in-out infinite;
  transition:transform .35s;
  filter:drop-shadow(0 20px 40px rgba(255,105,180,.7));
}

.cat-box:hover { transform:scale(1.1) rotate(-2deg); }
.cat-box:active { transform:scale(0.92); }

@keyframes float {
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-18px); }
}

.cat { width:270px; display:block; }

/* کەوانە لەسەر پشیلە */
.bow {
  position:absolute;
  top:-5px;
  left:50%;
  transform:translateX(-50%);
  font-size:55px;
  animation:bowFloat 2s ease-in-out infinite;
  z-index:5;
}

@keyframes bowFloat {
  0%,100%{ transform:translateX(-50%) rotate(-5deg); }
  50%{ transform:translateX(-50%) rotate(5deg); }
}

/* گوڵ لە دەوری پشیلە */
.flower {
  position:absolute;
  font-size:24px;
  animation:flowerTwinkle 2.5s ease-in-out infinite;
  pointer-events:none;
}

@keyframes flowerTwinkle {
  0%,100%{ transform:scale(.7) rotate(0); opacity:.5; }
  50%{ transform:scale(1.2) rotate(180deg); opacity:1; }
}

/* دوگمە */
.hint {
  position:relative;
  z-index:10;
  margin-top:35px;
  padding:15px 32px;
  background:linear-gradient(135deg,#ff69b4,#ff1493,#ff69b4);
  background-size:200% 200%;
  color:#fff;
  font-weight:700;
  font-size:1.05rem;
  border-radius:50px;
  box-shadow:0 10px 30px rgba(255,20,147,.6), 0 0 0 3px rgba(255,255,255,.3) inset;
  animation:pulseBtn 2s ease-in-out infinite, gradientShift 3s ease infinite;
  text-align:center;
  cursor:pointer;
  border:none;
}

@keyframes gradientShift {
  0%,100%{ background-position:0% 50%; }
  50%{ background-position:100% 50%; }
}

@keyframes pulseBtn {
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.08); }
}

/* مۆداڵ */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(20,5,40,.85);
  backdrop-filter:blur(10px);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.on { display:flex; }

/* کارتی نامە */
.box {
  background:linear-gradient(160deg,#fff5f9,#ffe0ed,#ffd6e8);
  border-radius:35px;
  padding:60px 35px;
  max-width:560px;
  width:100%;
  text-align:center;
  box-shadow:
    0 30px 90px rgba(255,20,147,.7),
    0 0 0 5px #ffb3c6 inset,
    0 0 0 8px #fff inset;
  border:4px solid #ff69b4;
  position:relative;
  animation:pop .7s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
}

.box::before {
  content:'💗';
  position:absolute;
  top:15px;
  right:20px;
  font-size:32px;
  animation:heartBeat 1.5s ease-in-out infinite;
}

.box::after {
  content:'💗';
  position:absolute;
  bottom:15px;
  left:20px;
  font-size:32px;
  animation:heartBeat 1.5s ease-in-out infinite .5s;
}

@keyframes heartBeat {
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.35); }
}

@keyframes pop {
  from{ transform:scale(.3) rotate(-10deg); opacity:0; }
  to{ transform:scale(1) rotate(0); opacity:1; }
}

.box .icon-top {
  font-size:3rem;
  margin-bottom:20px;
  animation:bounce 1.5s ease-in-out infinite;
}

@keyframes bounce {
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-12px); }
}

.box p {
  font-size:clamp(1.1rem,4vw,1.5rem);
  color:#c2255c;
  line-height:2.5;
  font-weight:700;
  position:relative;
  z-index:2;
}

.box .em {
  font-size:2rem;
  margin-top:30px;
  letter-spacing:12px;
  animation:bounce 1.5s ease-in-out infinite;
}

.close {
  position:absolute;
  top:14px;
  left:16px;
  background:#ff69b4;
  border:none;
  color:#fff;
  font-size:22px;
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  font-weight:bold;
  transition:.3s;
  z-index:5;
  box-shadow:0 4px 12px rgba(255,20,147,.5);
}

.close:hover { background:#ff1493; transform:rotate(90deg) scale(1.15); }

/* کاغەزی ڕەنگاوڕەنگ */
.confetti {
  position:fixed;
  width:10px;
  height:10px;
  z-index:200;
  pointer-events:none;
  animation:confettiFall 3.5s ease-out forwards;
}

@keyframes confettiFall {
  0%{ transform:translateY(0) rotate(0); opacity:1; }
  100%{ transform:translateY(110vh) rotate(720deg); opacity:0; }
}

/* گوڵ و دڵ لە دەرەوەی کارتەکە */
.side-flower {
  position:absolute;
  font-size:30px;
  animation:floatSmall 3s ease-in-out infinite;
}

@keyframes floatSmall {
  0%,100%{ transform:translateY(0) rotate(-5deg); }
  50%{ transform:translateY(-15px) rotate(5deg); }
}
</style>
</head>
<body>

<div class="star-bg"></div>

<!-- گوڵ و دڵی فڕیو -->
<div id="floaters"></div>

<div class="top-card">
  <span>🎀 تایبەت بۆ تۆ 🎀</span>
</div>

<h1>ئاران گیان، دایرییەکت بۆ هاتووە! 🎁</h1>

<p class="subtitle">
  کەسێک کە خۆشی دەوێت شتێکی بۆ ئامادەکردوویت 💖<br>
  دەستی پێوە بنێ و بیکەرەوە 🌸
</p>

<div class="cat-wrap">
  <div class="cat-box" onclick="openLetter()">
    <div class="bow">🎀</div>
    <svg class="cat" viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg">
      <!-- گوێ -->
      <polygon points="70,90 55,20 120,70" fill="#f79b4a"/>
      <polygon points="230,90 245,20 180,70" fill="#f79b4a"/>
      <polygon points="78,85 68,38 112,72" fill="#ffd1b3"/>
      <polygon points="222,85 232,38 188,72" fill="#ffd1b3"/>
      <!-- سەر -->
      <ellipse cx="150" cy="150" rx="95" ry="80" fill="#f79b4a"/>
      <!-- خاڵەکان -->
      <ellipse cx="100" cy="120" rx="12" ry="7" fill="#e07b2a" opacity=".5"/>
      <ellipse cx="200" cy="120" rx="12" ry="7" fill="#e07b2a" opacity=".5"/>
      <ellipse cx="150" cy="105" rx="10" ry="6" fill="#e07b2a" opacity=".4"/>
      <!-- چاو -->
      <ellipse cx="112" cy="150" rx="18" ry="21" fill="#fff"/>
      <ellipse cx="188" cy="150" rx="18" ry="21" fill="#fff"/>
      <ellipse cx="114" cy="153" rx="11" ry="13" fill="#2d6a4f"/>
      <ellipse cx="190" cy="153" rx="11" ry="13" fill="#2d6a4f"/>
      <circle cx="109" cy="147" r="4.5" fill="#fff"/>
      <circle cx="185" cy="147" r="4.5" fill="#fff"/>
      <circle cx="119" cy="158" r="2.5" fill="#fff" opacity=".9"/>
      <circle cx="195" cy="158" r="2.5" fill="#fff" opacity=".9"/>
      <!-- لووت -->
      <polygon points="150,172 143,182 157,182" fill="#ff8fa3"/>
      <ellipse cx="150" cy="184" rx="6" ry="4" fill="#ffb3c1"/>
      <!-- دەم -->
      <path d="M150 188 Q135 205 122 195" stroke="#d67b3a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M150 188 Q165 205 178 195" stroke="#d67b3a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- سمێڵ -->
      <line x1="85" y1="135" x2="125" y2="128" stroke="#e07b2a" stroke-width="3" stroke-linecap="round"/>
      <line x1="215" y1="135" x2="175" y2="128" stroke="#e07b2a" stroke-width="3" stroke-linecap="round"/>
      <!-- لاشە -->
      <ellipse cx="150" cy="280" rx="80" ry="55" fill="#f79b4a"/>
      <!-- پێ -->
      <ellipse cx="105" cy="325" rx="28" ry="15" fill="#f79b4a"/>
      <ellipse cx="195" cy="325" rx="28" ry="15" fill="#f79b4a"/>
      <ellipse cx="105" cy="328" rx="18" ry="8" fill="#ffd1b3"/>
      <ellipse cx="195" cy="328" rx="18" ry="8" fill="#ffd1b3"/>
      <!-- دەستەکان -->
      <ellipse cx="110" cy="250" rx="18" ry="14" fill="#f79b4a"/>
      <ellipse cx="190" cy="250" rx="18" ry="14" fill="#f79b4a"/>
      <!-- کەوانەی پینک لەسەر سنگ -->
      <ellipse cx="150" cy="255" rx="25" ry="18" fill="#ff69b4"/>
      <ellipse cx="150" cy="255" rx="15" ry="10" fill="#ffb3c6"/>
    </svg>
    <div class="flower" style="top:20%; left:-10%;">🌸</div>
    <div class="flower" style="top:50%; right:-10%; animation-delay:.5s;">🌷</div>
    <div class="flower" style="bottom:15%; left:-5%; animation-delay:1s;">✨</div>
    <div class="flower" style="bottom:25%; right:-8%; animation-delay:1.5s;">💖</div>
  </div>
</div>

<button class="hint" onclick="openLetter()">
  🐱 کرتە لەسەر پشیلەکە بکە 💌
</button>

<!-- مۆداڵ -->
<div class="modal" id="m" onclick="if(event.target===this)closeLetter()">
  <div class="box">
    <button class="close" onclick="closeLetter()">✕</button>
    <div class="icon-top">💌</div>
    <p>
      ئاران، یەکەم بوونت زۆر پیرۆز بێت،<br>
      هەمیشە وا بدرەوشێیتەوە و ببیتە مایەی شانازی 🥹🤍<br>
      بەڕاستی کەسێکی وەک تۆ شایەنی<br>
      هەموو جوانییەکانی ژیانە. 🫶🏻🌷
    </p>
    <div class="em">🎂🎈🎁🌸✨</div>
  </div>
</div>

<script>
// دڵ و گوڵی فڕیو
const symbols = ['💖','🌸','✨','💗','🌷','⭐','🩷','💕','🎀','💐','🌟','💫'];
const floaters = document.getElementById('floaters');
for (let i = 0; i < 30; i++) {
  const el = document.createElement('div');
  el.className = 'floaty';
  el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
  el.style.left = Math.random() * 100 + '%';
  el.style.fontSize = (Math.random() * 20 + 14) + 'px';
  el.style.animationDuration = (Math.random() * 7 + 7) + 's';
  el.style.animationDelay = (Math.random() * 8) + 's';
  floaters.appendChild(el);
}

// کردنەوەی نامە
function openLetter() {
  document.getElementById('m').classList.add('on');
  createConfetti();
}

// داخستنی نامە
function closeLetter() {
  document.getElementById('m').classList.remove('on');
}

// کاغەزی ڕەنگاوڕەنگ
function createConfetti() {
  const colors = ['#ff69b4','#ffd700','#ff1493','#a78bfa','#4ade80','#60a5fa','#fbbf24','#ec4899','#f472b6'];
  const shapes = ['50%','0','30%'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.top = '-10px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
      c.style.width = (Math.random() * 10 + 6) + 'px';
      c.style.height = (Math.random() * 10 + 6) + 'px';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }, i * 35);
  }
}

// ESC بۆ داخستن
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLetter();
});
</script>
</body>
</html>
