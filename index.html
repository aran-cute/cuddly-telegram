<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 پیرۆزبایی بۆ ئاران گیان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#fff0f5 0%,#ffe0ed 50%,#ffd6e8 100%);
  font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
  padding:20px;
  overflow-x:hidden;
  position:relative;
}

.floaty {
  position:fixed;
  top:-10%;
  pointer-events:none;
  z-index:1;
  animation:fall linear infinite;
  filter:drop-shadow(0 0 6px rgba(255,182,193,.7));
}

@keyframes fall {
  0%{ transform:translateY(-10vh) rotate(0); opacity:1; }
  100%{ transform:translateY(115vh) rotate(360deg); opacity:0; }
}

h1 {
  position:relative;
  z-index:10;
  font-size:clamp(1.4rem,5.5vw,2.6rem);
  color:#c2255c;
  text-align:center;
  margin-bottom:10px;
  font-weight:900;
  line-height:1.8;
  padding:0 10px;
  text-shadow:2px 2px 12px rgba(255,105,180,.4);
}

.subtitle {
  position:relative;
  z-index:10;
  color:#a61e4d;
  text-align:center;
  font-size:clamp(.95rem,3.2vw,1.15rem);
  margin-bottom:30px;
  font-weight:600;
  padding:0 15px;
  line-height:1.9;
}

.photo-card {
  position:relative;
  z-index:10;
  background:#fff;
  padding:15px 15px 25px;
  border-radius:20px;
  box-shadow:
    0 20px 50px rgba(214,51,108,.35),
    0 0 0 3px #ffb3c6 inset;
  transform:rotate(-3deg);
  transition:transform .4s;
  max-width:340px;
  width:100%;
  cursor:pointer;
  animation:floatCard 4s ease-in-out infinite;
}

.photo-card:hover { transform:rotate(0deg) scale(1.03); }

@keyframes floatCard {
  0%,100%{ transform:rotate(-3deg) translateY(0); }
  50%{ transform:rotate(-3deg) translateY(-10px); }
}

.photo-card img {
  width:100%;
  border-radius:12px;
  display:block;
}

.photo-card .caption {
  text-align:center;
  margin-top:15px;
  color:#c2255c;
  font-size:1.05rem;
  font-weight:700;
  font-family:'Vazirmatn',sans-serif;
}

.tape {
  position:absolute;
  width:70px;
  height:22px;
  background:rgba(255,182,193,.85);
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.tape.tl { top:-8px; left:20px; transform:rotate(-25deg); }
.tape.tr { top:-8px; right:20px; transform:rotate(25deg); }

.hint {
  position:relative;
  z-index:10;
  margin-top:35px;
  padding:15px 32px;
  background:linear-gradient(135deg,#ffb3c6,#ff8fab);
  color:#fff;
  font-weight:700;
  font-size:1.05rem;
  border-radius:50px;
  box-shadow:0 10px 25px rgba(214,51,108,.4);
  animation:pulseBtn 2s ease-in-out infinite;
  text-align:center;
  cursor:pointer;
  border:none;
  font-family:'Vazirmatn',sans-serif;
}

@keyframes pulseBtn {
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.07); }
}

.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(120,20,60,.6);
  backdrop-filter:blur(8px);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.on { display:flex; }

.box {
  background:linear-gradient(160deg,#fffafc,#fff0f5,#ffe8f0);
  border-radius:30px;
  padding:55px 32px;
  max-width:540px;
  width:100%;
  text-align:center;
  box-shadow:
    0 30px 80px rgba(214,51,108,.5),
    0 0 0 4px #ffd1e3 inset;
  border:3px solid #ffb3c6;
  position:relative;
  animation:pop .6s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
}

.box::before {
  content:'💗';
  position:absolute;
  top:12px;
  right:18px;
  font-size:26px;
  animation:heartBeat 1.5s ease-in-out infinite;
}

.box::after {
  content:'💗';
  position:absolute;
  bottom:12px;
  left:18px;
  font-size:26px;
  animation:heartBeat 1.5s ease-in-out infinite .5s;
}

@keyframes heartBeat {
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.3); }
}

@keyframes pop {
  from{ transform:scale(.3) rotate(-10deg); opacity:0; }
  to{ transform:scale(1) rotate(0); opacity:1; }
}

.box .icon {
  font-size:2.8rem;
  margin-bottom:18px;
  animation:bounce 1.5s ease-in-out infinite;
}

@keyframes bounce {
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-10px); }
}

.box p {
  font-size:clamp(1.05rem,3.8vw,1.4rem);
  color:#c2255c;
  line-height:2.5;
  font-weight:700;
  position:relative;
  z-index:2;
}

.box .em {
  font-size:1.8rem;
  margin-top:25px;
  letter-spacing:10px;
  animation:bounce 1.5s ease-in-out infinite;
}

.close {
  position:absolute;
  top:14px;
  left:16px;
  background:#ffb3c6;
  border:none;
  color:#fff;
  font-size:20px;
  width:40px;
  height:40px;
  border-radius:50%;
  cursor:pointer;
  font-weight:bold;
  transition:.3s;
  z-index:5;
}

.close:hover { background:#d6336c; transform:rotate(90deg); }
</style>
</head>
<body>

<h1>💌 پیرۆزبایی بۆ ئاران گیان 💌</h1>

<p class="subtitle">
  بۆ یەکەم بوونت، بە هەموو دڵمەوە<br>
  کرتە لە وێنەکە بکە بۆ خوێندنەوەی نامەکە 🌸
</p>

<div class="photo-card" onclick="openLetter()">
  <div class="tape tl"></div>
  <div class="tape tr"></div>
  <img src="https://i.postimg.cc/sMkvZmMt/1792149420927.jpg" alt="ئاران">
  <div class="caption">بۆ ئاران گیان 🎀</div>
</div>

<button class="hint" onclick="openLetter()">
  💌 کرتە بکە بۆ کردنەوەی نامەکە
</button>

<div class="modal" id="m" onclick="if(event.target===this)closeLetter()">
  <div class="box">
    <button class="close" onclick="closeLetter()">✕</button>
    <div class="icon">💌</div>
    <p>
      ئاران گیان، یەکەم بوونت زۆر پیرۆز بێت 🎂<br>
      هەمیشە وا بدرەوشێیتەوە و<br>
      ببیتە مایەی شانازی 🥹🤍<br>
      بەڕاستی کەسێکی وەک تۆ شایەنی<br>
      هەموو جوانییەکانی ژیانە 🫶🏻🌷
    </p>
    <div class="em">🎀🌸💖🌷✨</div>
  </div>
</div>

<script>
const symbols = ['💖','🌸','✨','💗','🌷','🩷','🎀','💕'];
for (let i = 0; i < 25; i++) {
  const el = document.createElement('div');
  el.className = 'floaty';
  el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
  el.style.left = Math.random() * 100 + '%';
  el.style.fontSize = (Math.random() * 16 + 14) + 'px';
  el.style.animationDuration = (Math.random() * 6 + 7) + 's';
  el.style.animationDelay = (Math.random() * 7) + 's';
  document.body.appendChild(el);
}

function openLetter() {
  document.getElementById('m').classList.add('on');
}
function closeLetter() {
  document.getElementById('m').classList.remove('on');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLetter();
});
</script>
</body>
</html>
